        <nav>
            <h2>

    <!-- Library main content -->
    <main>
        <div class="top-half-container">
            <div class="addbook-container">
                <h2 class="book-list-h2">Add book</h2>
                <form class="book-form" action="" name="bookForm">
                    <!-- <h2 class="add-book-heading">Add Book</h2> -->
                    <!-- 1 -->
                    <div class="title-container">
                        <label for="book">Title:</label><br>
                        <input placeholder="e.g. Lord of the Rings" id="book" name="book" value="">
                    </div>
                    <!-- 2 -->
                    <div class="author-container">
                        <label for="author">Author:</label><br>
                        <input placeholder="e.g. Albert Camus" type="text" id="author" name="author" value="">
                    </div>
                    <!-- 3 -->
                    <div class="pages-container">
                        <label for="pages">Pages:</label><br>
                        <input min="0" placeholder="e.g. 5123" type="number" id="pages" name="pages" value="">
                    </div>
                    <!-- 4 -->
                    <div class="read-submit-container">
                        <div class="read-container">
                            <input type="checkbox" id="read" name="read" value="">
                            <label for="read">Read?</label>
                        </div>
                        <div class="submit-container">
                            <!-- <label for="">Submit:</label><br> -->
                            <button type="button" id="submit">Add Book</button>
                        </div>
                    </div>
                </form>
            </div>

        <div class="dividing-line"></div>

        <h2 class="book-list-h2">Book List</h2>

        <div class="book-list-container">
            <br>
            <div id="book-item" class="book-item">
                <div class="book-info-container">
                    <h3 id="bl-title" class="book-title">The Davinci Davinki</h3>
                    <h3 id="bl-author" class="book-author">Laura Pomela</h3>
                    <p id="bl-pages" class="book-pages">356&nbsp;<span>pages</span></p>
                </div>
                <div class="book-btn-container">
                    <button class="fav-book-btn">
                        <img class="filter-yellow" src="img/star_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"
                            alt="Favorite book from book list button">
                    </button>
                    &nbsp;&nbsp;
                    <button type="button" class="delete-book-btn">
                        <img class="filter-black" src="img/delete_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"

                    </button>

                    &nbsp;&nbsp;

                    &nbsp;
                    <label for="read-book-list">read</label>
